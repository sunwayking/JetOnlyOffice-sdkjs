name: Check sdkjs

on:
  push:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
      - 'hotfix/**'

jobs:
  source-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out JetOnlyOffice SDKJS
        uses: actions/checkout@v4
        with:
          path: sdkjs

      - name: Check out locked sdkjs-forms mirror
        uses: actions/checkout@v4
        with:
          repository: sunwayking/JetOnlyOffice-sdkjs-forms
          path: sdkjs-forms
          ref: 1a883281c41fa9aa5e98c64cce13b14782f92f56

      - name: Build SDKJS
        working-directory: sdkjs
        run: python build/build.py --mobile --addon ../sdkjs-forms

  locked-baseline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out JetOnlyOffice SDKJS
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check changed SDKJS syntax
        run: |
          node --check common/apiBase.js
          node --check common/docscoapi.js
          node --check pdf/api.js
          node --check pdf/src/document.js
          node --check pdf/src/file.js
          node --check pdf/src/forms/signature.js
          node --check pdf/src/textSelectTrackHandler.js
          node --check word/api.js

      - name: Run locked Mobile contract tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/mobile/*.test.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo 'No locked Mobile tests were found.' >&2
            exit 1
          fi
          node --test "${tests[@]}"
